<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Cat</title>
<style>
  body{font-family:sans-serif;max-width:420px;margin:2rem auto;padding:0 1rem}
  button{font-size:1.1rem;padding:.7rem 1rem;margin:.25rem}
  input,select{font-size:1.1rem;padding:.5rem;width:6rem}
  #msg{margin-top:1rem;color:#555}
</style></head><body>
<h1>🐱 Lucky Cat</h1>

<h3>Wave</h3>
<button onclick="wave(1)">1</button>
<button onclick="wave(5)">5</button>
<button onclick="wave(10)">10</button>
<div>
  <input id="n" type="number" min="1" max="255" value="3">
  <button onclick="wave($('n').value)">Send</button>
</div>

<h3>Continuous</h3>
<input id="secs" type="number" min="1" max="3600" value="30"> seconds
<select id="speed">
  <option>slow</option><option selected>medium</option><option>fast</option>
</select>
<div>
  <button onclick="cont()">Start</button>
  <button onclick="call('/stop')">Stop</button>
</div>

<div id="msg"></div>
<script>
const $ = id => document.getElementById(id);
async function call(url) {
  try { $('msg').textContent = await (await fetch(url)).text(); }
  catch (e) { $('msg').textContent = 'no response'; }
}
function wave(n) { call('/wave?n=' + encodeURIComponent(n)); }
function cont() { call('/continuous?secs=' + $('secs').value + '&speed=' + $('speed').value); }
</script>
</body></html>
